# Srodowisko projektu Big Data: Steam + Wikipedia
# Wersje zgodne z maszyna z laboratoriow:
#   Hadoop 3.4.1, Hive 4.1.0, Spark 3.5.6, Kafka 3.9.2, NiFi 1.28.0, HBase 2.6.7, Python 3.12, Java 17
#
# Uruchamianie etapami:
#   docker compose up -d                        -> baza: HDFS + metastore Hive (zawsze wlaczona)
#   docker compose --profile ingest up -d       -> + NiFi, Kafka, HiveServer2  (pobieranie i skladowanie)
#   docker compose --profile analysis up -d     -> + Spark/Jupyter, HBase      (analiza i widoki)
#   docker compose stop nifi kafka hiveserver2  -> zatrzymanie etapu ingest    (dane zostaja)
#   docker compose stop jupyter hbase           -> zatrzymanie etapu analysis

services:

  # ------------------------------------------------------------------
  # BAZA
  # ------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.4.1
    container_name: namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    env_file: ./config/hadoop/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
      HDFS_NAMENODE_OPTS: "-Xmx512m"
    ports:
      - "9870:9870"
    volumes:
      - hdfs_name:/hadoop/dfs
    mem_limit: 768m
    restart: unless-stopped
    networks: [bigdata]

  datanode:
    image: apache/hadoop:3.4.1
    container_name: datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file: ./config/hadoop/hadoop.env
    environment:
      HDFS_DATANODE_OPTS: "-Xmx384m"
    volumes:
      - hdfs_data:/hadoop/dfs
    depends_on: [namenode]
    mem_limit: 640m
    restart: unless-stopped
    networks: [bigdata]

  hive-db:
    image: postgres:16-alpine
    container_name: hive-db
    hostname: hive-db
    environment:
      POSTGRES_DB: metastore_db
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    volumes:
      - hive_db:/var/lib/postgresql/data
    mem_limit: 256m
    restart: unless-stopped
    networks: [bigdata]

  metastore:
    image: apache/hive:4.1.0
    container_name: metastore
    hostname: metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx512m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-db:5432/metastore_db
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    ports:
      - "9083:9083"
    volumes:
      - ./config/hive:/hive_custom_conf:ro
      - ./jars/postgresql-42.7.4.jar:/opt/hive/lib/postgres.jar:ro
    depends_on: [hive-db, namenode, datanode]
    mem_limit: 900m
    restart: unless-stopped
    networks: [bigdata]

  # ------------------------------------------------------------------
  # ETAP ingest:
  # ------------------------------------------------------------------
  hiveserver2:
    image: apache/hive:4.1.0
    container_name: hiveserver2
    hostname: hiveserver2
    profiles: ["ingest"]
    environment:
      SERVICE_NAME: hiveserver2
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: "-Xmx768m -Dhive.metastore.uris=thrift://metastore:9083"
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./config/hive:/hive_custom_conf:ro
    depends_on: [metastore]
    mem_limit: 1300m
    restart: unless-stopped
    networks: [bigdata]

  kafka:
    image: apache/kafka:3.9.2
    container_name: kafka
    hostname: kafka
    profiles: ["ingest"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "29092:29092"
    mem_limit: 900m
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [bigdata]

  nifi:
    image: apache/nifi:1.28.0
    container_name: nifi
    hostname: nifi
    profiles: ["ingest"]
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "8080:8080"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
      - ./data/input:/opt/nifi/input
      - ./config/hadoop:/opt/nifi/hadoop-conf:ro
    mem_limit: 1600m
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [bigdata]

  # ------------------------------------------------------------------
  # ETAP analysis:
  # ------------------------------------------------------------------
  jupyter:
    build: ./jupyter
    image: projekt/jupyter-spark:3.5.6
    container_name: jupyter
    hostname: jupyter
    profiles: ["analysis"]
    environment:
      SPARK_CONF_DIR: /opt/spark-conf
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:4040:4040"
    volumes:
      - ./notebooks:/home/work
      - ./config/spark:/opt/spark-conf:ro
      - spark_ivy:/root/.ivy2
    mem_limit: 2500m
    restart: unless-stopped
    networks: [bigdata]

  hbase:
    build: ./hbase
    image: projekt/hbase:2.6.7
    container_name: hbase
    hostname: hbase
    profiles: ["analysis"]
    environment:
      HBASE_HEAPSIZE: 512m
    ports:
      - "16010:16010"
      - "9090:9090"
    volumes:
      - hbase_data:/data
    mem_limit: 1200m
    restart: unless-stopped
    networks: [bigdata]

networks:
  bigdata:
    name: bigdata

volumes:
  hdfs_name:
  hdfs_data:
  hive_db:
  nifi_conf:
  nifi_state:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  hbase_data:
  spark_ivy:
