# Spark 3.5.6 polaczony z metastore Hive i HDFS
spark.sql.catalogImplementation      hive
spark.hadoop.hive.metastore.uris     thrift://metastore:9083
spark.hadoop.fs.defaultFS            hdfs://namenode:8020
spark.sql.warehouse.dir              hdfs://namenode:8020/user/hive/warehouse
spark.driver.memory                  1g
spark.sql.session.timeZone           UTC
spark.sql.shuffle.partitions         8

# Spark 3.5 ma wbudowanego klienta Hive 2.3, ktory nie dziala z metastore Hive 4
# (blad "Invalid method name: 'get_table'"). Uzywamy klienta 3.1.3 pobieranego z Mavena.
spark.sql.hive.metastore.version     3.1.3
spark.sql.hive.metastore.jars        maven
# Biblioteki (~240 MB) laduja w /root/.ivy2 - to wolumen spark_ivy w docker-compose.yml,
# wiec pobieraja sie tylko raz.
