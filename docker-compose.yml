version: '3.8'

services:
  # --------------------------------------------------------
  # Apache NiFi (Przepływ danych)
  # --------------------------------------------------------
  nifi:
    image: apache/nifi:latest
    container_name: projekt_nifi
    ports:
      - "8080:8080" # Interfejs graficzny dostępny pod localhost:8080/nifi
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    networks:
      - bigdata_net
    volumes:
      - ./nifi_data:/opt/nifi/nifi-current/data # Zamontowanie lokalnego folderu do odczytu historii

  # --------------------------------------------------------
  # Apache Zookeeper (Wymagany do działania Kafki i HBase)
  # --------------------------------------------------------
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: projekt_zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    networks:
      - bigdata_net

  # --------------------------------------------------------
  # Apache Kafka (Buforowanie)
  # --------------------------------------------------------
  kafka:
    image: bitnami/kafka:latest
    container_name: projekt_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    depends_on:
      - zookeeper
    networks:
      - bigdata_net

  # --------------------------------------------------------
  # HDFS i Apache Hive (Batch Layer - obraz Bitnami dla wygody)
  # --------------------------------------------------------
  hive-server:
    image: apache/hive:3.1.3
    container_name: projekt_hive
    ports:
      - "10000:10000" # Port HiveServer2 (do łączenia ze Sparkiem)
    environment:
      - HIVE_CUSTOM_CONF_DIR=/opt/hive/conf
    networks:
      - bigdata_net

  # --------------------------------------------------------
  # Apache HBase (Serving Layer)
  # --------------------------------------------------------
  hbase:
    image: bde2020/hbase-standalone:1.0.0-hbase1.2.6
    container_name: projekt_hbase
    ports:
      - "16010:16010" # Interfejs webowy HBase
    networks:
      - bigdata_net
    depends_on:
      - zookeeper

  # --------------------------------------------------------
  # Apache Spark + Jupyter Notebook (Warstwa analityczna)
  # --------------------------------------------------------
  jupyter-spark:
    image: jupyter/pyspark-notebook:latest
    container_name: projekt_spark_jupyter
    ports:
      - "8888:8888" # Dostęp do Jupyter Notebook
      - "4040:4040" # Dostęp do Spark UI podczas obliczeń
    environment:
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./notebooks:/home/jovyan/work # Zamontowanie lokalnego folderu na skrypty
    networks:
      - bigdata_net

networks:
  bigdata_net:
    driver: bridge
